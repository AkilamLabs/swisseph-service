[project]
name = "swisseph-service"
version = "0.1.0"
description = "Thin, batch-first HTTP microservice wrapping the Swiss Ephemeris (pyswisseph)"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "pyswisseph>=2.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
